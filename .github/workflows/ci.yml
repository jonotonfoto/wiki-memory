name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
      # Windows-раннеры: консоль cp1252 не кодирует кириллицу — принты
      # серверов/тестов падают UnicodeEncodeError и дочерние дашборды
      # «не стартуют». Форсим UTF-8 всем процессам.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      # Подпроцессно-портовые дашборд-тесты (живой сервер) на холодных
      # раннерах нестабильны — в CI выключаются, локально гоняются всегда.
      WIKI_CI_SKIP_SERVER_TESTS: "1"
      # ВАЖНО: НЕ задавать WIKI_EMBED_BACKEND=nvidia здесь. Тесты рассчитаны
      # на офлайн-бэкенд по умолчанию (llamaserver -> connection refused):
      # это детерминированный «embed недоступен», на котором построены
      # fail-open сценарии индексации. nvidia ходил бы в реальный API.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install deps
        run: pip install numpy requests pyyaml pytest
      - name: Run test suite (invariants)
        run: python -m pytest src/wiki_v2/tests -q
