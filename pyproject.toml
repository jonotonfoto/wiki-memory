[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wiki-memory"
version = "1.0.0"
description = "Automatic semantic memory for Hermes Agent: session -> knowledge base -> search."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hermes Agent" }]
dependencies = [
    "numpy>=1.24,<3",
    "requests>=2.28,<3",
]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[tool.setuptools]
packages = ["wiki_v2"]

[tool.setuptools.package-dir]
wiki_v2 = "src/wiki_v2"

[tool.pytest.ini_options]
testpaths = ["src/wiki_v2/tests"]
